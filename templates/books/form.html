{% extends "base.html" %}

{% block title %}{{ "Редагування книги" if book else "Нова книга" }} — BookShelf{% endblock %}

{% block content %}
<section class="card narrow">
    <h1>{{ "Редагування книги" if book else "Нова книга" }}</h1>

    <form method="post">
        <label for="title">Назва</label>
        <input type="text" id="title" name="title" maxlength="150" required autofocus
               value="{{ book.title if book else '' }}">

        <label for="author">Автор</label>
        <input type="text" id="author" name="author" maxlength="100" required
               value="{{ book.author if book else '' }}">

        <label for="status">Статус</label>
        <select id="status" name="status">
            {% for key, label in statuses.items() %}
            <option value="{{ key }}" {% if book and book.status == key %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn">Зберегти</button>
        <a class="btn btn-ghost" href="{{ url_for('books.index') }}">Скасувати</a>
    </form>
</section>
{% endblock %}
