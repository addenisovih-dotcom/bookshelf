{% extends "base.html" %}

{% block title %}Вхід — BookShelf{% endblock %}

{% block content %}
<section class="card narrow">
    <h1>Вхід</h1>

    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <label for="username">Ім'я користувача</label>
        <input type="text" id="username" name="username"
               maxlength="50" {% if is_required %}required{% endif %} autofocus autocomplete="username">

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password"
               {% if is_required %}required{% endif %} autocomplete="current-password">

        <label class="check">
            <input type="checkbox" name="remember" id="remember">
            Запам'ятати мене
        </label>

        <button type="submit" class="btn">Увійти</button>
    </form>

    <p class="hint">Немає акаунта? <a href="{{ url_for('auth.register') }}">Зареєструватися</a></p>
</section>
{% endblock %}
